name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A tag is not a merge, so nothing has necessarily run the gate against
      # this exact commit. Releasing a red build is worse than releasing late.
      # This is the same list CI runs — every part of it, or a tag placed on an
      # unmerged commit ships below a bar main is held to.
      - run: go build ./... && go vet ./... && go test ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: ./scripts/scenarios.sh
      - run: ./scripts/cover.sh 85

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
