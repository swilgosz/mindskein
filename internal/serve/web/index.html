<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mindskein</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo">mindskein</span>
      <span id="version" class="version"></span>
    </div>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <button id="theme" type="button" class="icon-btn" title="Toggle light and dark" aria-label="Toggle light and dark">◐</button>
    </div>
  </aside>
  <main class="content">
    <header class="page-head">
      <div class="page-title">
        <h1 id="title"></h1>
        <span id="stamp" class="stamp"></span>
      </div>
      <div class="page-tools">
        <div id="toolbar" class="toolbar"></div>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Views" hidden></nav>
    <div id="page" class="grid" aria-live="polite"></div>
  </main>
</div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
